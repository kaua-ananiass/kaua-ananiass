name: Atualizar estatisticas do perfil
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - 'build_profile.py'
      - 'portrait-source.jpg'
      - '.github/workflows/update-profile.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install Pillow
      - name: Gerar SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: kaua-ananiass
        run: python build_profile.py
      - name: Publicar novas estatisticas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estatisticas do perfil"
            git push
          fi
